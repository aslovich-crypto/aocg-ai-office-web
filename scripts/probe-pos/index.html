<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>положение поиска</title>
<style>body{margin:0;background:#F6F7F9;width:390px}</style></head>
<body><div id="root"></div><div id="ЗАМЕР"></div>
<script>
(function(){
  var ж=0, итог={};
  function поле(корень){ // контейнер, в котором живёт input поиска
    var вх=document.querySelector('input[aria-label^="Поиск"]');
    if(!вх) return null;
    var э=вх.parentElement;
    while(э && getComputedStyle(э).borderRadius!=="10px") э=э.parentElement;
    return э||вх.parentElement;
  }
  function снять(имя){
    var э=поле(); if(!э){итог[имя]={ошибка:"поле не найдено"};return;}
    var r=э.getBoundingClientRect();
    итог[имя]={верх:Math.round(r.top), низ:Math.round(r.bottom),
               высота:Math.round(r.height)};
    итог[имя].шапка_до_поля=Math.round(r.top);
    /* T142-воздух: шапка→полоса, полоса→первая карточка, бока */
    var скр=[].slice.call(document.querySelectorAll("div")).find(function(e){
      var st=getComputedStyle(e);return st.overflowY==="auto"&&e.scrollHeight>=e.clientHeight;});
    if(скр){итог[имя].от_шапки=Math.round(r.top-скр.getBoundingClientRect().top+скр.scrollTop);}
    var кк=[].slice.call(document.querySelectorAll("div,button,section"))
      .map(function(e){var rr=e.getBoundingClientRect();
        return {e:e,t:rr.top,l:rr.left,rt:rr.right,h:rr.height,
                bg:getComputedStyle(e).backgroundColor};})
      .filter(function(x){return x.t>=r.bottom-1 && x.h>=36 && x.bg==="rgb(255, 255, 255)";})
      .sort(function(a,b){return a.t-b.t;})[0];
    /* сосед по потоку — честнее «первого белого»: в пробе списки пусты */
    var об=э.parentElement, сос=об?об.nextElementSibling:null;
    if(сос){var rс=сос.getBoundingClientRect();
      итог[имя].до_соседа=Math.round(rс.top-r.bottom);
      итог[имя].сосед=((сос.textContent||"").trim().slice(0,30))||сос.tagName;}
    if(кк){итог[имя].до_карточки=Math.round(кк.t-r.bottom);
      итог[имя].бок_полосы=Math.round(r.left);
      итог[имя].бок_карточки=Math.round(кк.l);}
    /* T144-разбор: откуда высота у содержимого — input против span */
    var вн=э.querySelector("input")||э.querySelector("span");
    if(вн){var с=getComputedStyle(вн), rv=вн.getBoundingClientRect();
      итог[имя].содержимое={тег:вн.tagName.toLowerCase(),
        высота:Math.round(rv.height*10)/10,
        line:с.lineHeight, шрифт:с.fontSize,
        pad:с.paddingTop+"/"+с.paddingBottom,
        border:с.borderTopWidth+"/"+с.borderBottomWidth,
        box:с.boxSizing};}
  }
  function кн(т){return [].slice.call(document.querySelectorAll("button")).find(function(b){return (b.textContent||"").trim()===т;});}
  function старт(){
    if(!document.querySelector('button[aria-label="Аккаунт"]') && ж++<40)
      return setTimeout(старт,150);
    снять("Главная");
    /* ⚠️ КАК ЧЕЛОВЕК: прокрутили «Главную» вниз, ПОТОМ пошли в профиль */
    var с=[].slice.call(document.querySelectorAll("div")).find(function(e){
      var st=getComputedStyle(e);return st.overflowY==="auto"&&e.scrollHeight>e.clientHeight;});
    if(с){с.scrollTop=250;с.dispatchEvent(new Event("scroll",{bubbles:true}));итог.скролл_перед_переходом=с.scrollTop;}
    /* ⚠️ событию scroll нужен такт: человек прокручивает с событиями,
       проба ставила scrollTop и кликала В ТОТ ЖЕ ТИК — позиция не успевала
       записаться, и «возврат» мерил артефакт пробы, а не приложение */
    setTimeout(function(){
    var а=document.querySelector('button[aria-label="Аккаунт"]'); if(а)а.click();
    setTimeout(function(){
      снять("Профиль");
      /* T144-обход: Чеки и Отчёты — полоса выезжает по лупе; Сводка — полосы
         быть не должно, отсутствие тоже проверяется */
      кн("Чеки").click();
      setTimeout(function(){
        var л=document.querySelector('button[aria-label="Поиск"]'); if(л)л.click();
        setTimeout(function(){
          снять("Чеки");
          кн("Отчёты").click();
          setTimeout(function(){
            var л2=document.querySelector('button[aria-label="Поиск"]'); if(л2)л2.click();
            setTimeout(function(){
              снять("Отчёты");
              кн("Сводка").click();
              setTimeout(function(){
                итог["Сводка_полей"]=document.querySelectorAll('input[aria-label^="Поиск"]').length;
      /* назад на «Главную»: позиция обязана ВЕРНУТЬСЯ (решение владельца) */
      var г=кн("Главная");
      if(г)г.click();
      setTimeout(function(){
        итог.скролл_после_возврата=с?Math.round(с.scrollTop):null;
        document.getElementById("ЗАМЕР").textContent=JSON.stringify(итог);
      },400);
              },500);
            },500);
          },500);
        },500);
      },500);
    },700);
    },80);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
