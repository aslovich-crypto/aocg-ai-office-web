<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>замер вида</title>
<style>body{margin:0}</style></head>
<body><div id="root"></div><div id="ЗАМЕР"></div>
<script>
(function(){
  var ж=0;
  function мера(вх){
    if(!вх) return null;
    var кк=вх.parentElement;
    while(кк && getComputedStyle(кк).borderRadius!=="10px") кк=кк.parentElement;
    if(!кк) return {ошибка:"контейнер r10 не найден"};
    var r=кк.getBoundingClientRect(), с=getComputedStyle(кк), си=getComputedStyle(вх);
    var зн=кк.querySelector("svg");
    return {полоса:Math.round(r.height), фон:с.backgroundColor,
      отступы:с.padding, рамка:с.borderTopWidth, зазор:с.gap,
      значок:зн?Math.round(зн.getBoundingClientRect().width):"нет",
      до_соседа:(function(){var о=кк.parentElement,с2=о?о.nextElementSibling:null;
        return с2?Math.round(с2.getBoundingClientRect().top-r.bottom):null;})(),
      поле:Math.round(вх.getBoundingClientRect().height*10)/10,
      pad:си.paddingTop+"/"+си.paddingBottom, кегль:си.fontSize};
  }
  function снять(){
    var п=document.querySelector('input[aria-label="Поиск по настройкам"]');
    var г=document.querySelector('input[aria-label="Поиск по чекам и отчётам"]');
    var к=document.querySelector('input[aria-label="Поиск статьи"]');
    if((!п||!г||!к) && ж++<40) return setTimeout(снять,150);
    document.getElementById("ЗАМЕР").textContent=JSON.stringify({
      Профиль:мера(п), Главная:мера(г), Категории:мера(к)});
  }
  снять();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
