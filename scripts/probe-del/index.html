<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>проба удаления отчёта</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ ПРОБА «УДАЛЕНИЕ ОТЧЁТА» (REP-EXPDEL ③). Отдельная от пробы отправки
// в 1С намеренно: предмет другой, а фазы удаления сносят отчёт, на котором
// стоит вся та проба. Общее у них — стенд, а не сценарий.
//
// Фаза приходит в адресе (?f=…), отчёты нужного статуса засеяны драйвером
// через базу. Проба открывает карточку так, как открывает человек, и читает
// низ и меню ТОЛЬКО внутри диалога отчёта: строка из соседнего экрана иначе
// сошла бы за строку карточки.
//
// ⚠️ ЧЕГО ЭТА ПРОБА НЕ ДЕЛАЕТ — НАЗВАНО ЗДЕСЬ, А НЕ В ОГОВОРКАХ. Свайп она
// выполняет НЕ ЖЕСТОМ: действие строки нажимается как кнопка. Значит
// проверено, что за свайпом стоит шторка, а не тост, — и НЕ проверено, что
// до действия доводит сам жест. Это известная слепота всех наших проб
// (улика 06.09.2026), и здесь она не закрывается.
(function(){
  var фаза=new URLSearchParams(location.search).get("f")||"";
  var шаги=[], ждём=0;
  function все(корень, селектор){
    return корень ? [].slice.call(корень.querySelectorAll(селектор)) : [];
  }
  function текст(э){ return (э && э.textContent || "").trim(); }
  function кнопкаВ(корень, т){
    return все(корень,'button').find(function(б){ return текст(б)===т; });
  }
  function страница(){ return document.body; }
  function диалог(){
    var д=все(страница(),'[role="dialog"]').filter(function(э){
      return (э.getAttribute('aria-label')||"").indexOf('Отчёт «')===0;
    });
    return д[д.length-1]||null;
  }
  // Низ карточки: подписи кнопок в порядке документа. Кнопки шапки и состава
  // сюда не попадают — берём только те, что лежат ПОСЛЕ последнего разделителя
  // низа: у низа своя обёртка с borderTop, и она последняя в диалоге.
  function низ(){
    var д=диалог(); if(!д) return "нет карточки";
    var обёртки=все(д,'div').filter(function(э){
      return (э.getAttribute('style')||"").indexOf('border-top')>=0
          && все(э,'button').length>0;
    });
    var посл=обёртки[обёртки.length-1];
    if(!посл) return "низа нет";
    var п=все(посл,'button').map(текст).filter(Boolean);
    return п.length ? п.join(" · ") : "низа нет";
  }
  function пунктыМеню(){ return все(страница(),'[role="menuitem"]').map(текст); }
  function меню(){
    if(!все(диалог(),'button[aria-label="Ещё"]').length) return "⋯ нет";
    var п=пунктыМеню();
    return п.length ? п.join(" · ") : "меню пустое";
  }
  function открытьОтчёты(){ var к=кнопкаВ(страница(),"Отчёты"); if(к) к.click(); }
  function открытьОтчёт(имя){
    return function(){
      var строка=все(страница(),'[role="button"]').filter(function(э){
        return текст(э).indexOf(имя)>=0;
      }).pop();
      if(строка) строка.click();
    };
  }
  function открытьМеню(){ var к=все(диалог(),'button[aria-label="Ещё"]')[0]; if(к) к.click(); }
  function шторка(){ return все(страница(),'[role="alertdialog"][aria-label="Удалить отчёт?"]')[0]||null; }
  function удалитьИзМеню(){
    открытьМеню();
    setTimeout(function(){
      var п=пунктыМеню().length ? все(страница(),'[role="menuitem"]') : [];
      var н=п.find(function(э){ return текст(э)==="Удалить отчёт"; });
      if(н) н.click();
    }, 500);
  }
  function подтвердить(){
    var ш=шторка(); if(!ш) return;
    var к=кнопкаВ(ш,"Удалить"); if(к) к.click();
  }
  function естьВСписке(имя){
    return function(){
      return все(страница(),'[role="button"]').some(function(э){
        return текст(э).indexOf(имя)>=0;
      }) ? "в списке есть" : "в списке нет";
    };
  }
  var ЧЕРНОВИК="Черновик на снос", ПРОВЕРКА="Проверка на снос";
  var ОДОБРЕН="Одобрен уехавший", ОТКЛОНЁН="Отклонён на снос", СВАЙП="Свайпом на снос";
  function открыть(имя){
    return [
      ["⓪ экран отчётов", открытьОтчёты, function(){ return кнопкаВ(страница(),"Отчёты") ? "Отчёты" : "НЕТ"; }],
      ["⓪б карточка открыта", открытьОтчёт(имя), function(){
        var д=диалог();
        if(!д) return "не открыта";
        // Открыта И загрузилась: без признака ответа сервера «низа нет»
        // значило бы «карточка пустая», а не «низа нет».
        return все(д,'button').length>1 ? "открыта" : "открыта, не загрузилась";
      }, 1800],
    ];
  }
  var ФАЗЫ={
    "черновик": открыть(ЧЕРНОВИК).concat([
      ["①а низ без удаления", null, низ],
      ["①б удаление в меню", открытьМеню, меню],
      ["①в шторка, а не тост", function(){
          var п=все(страница(),'[role="menuitem"]').find(function(э){ return текст(э)==="Удалить отчёт"; });
          if(п) п.click();
        }, function(){ return шторка() ? "шторка открыта" : "шторки нет"; }, 1400],
      ["①г удалено", подтвердить, естьВСписке(ЧЕРНОВИК), 2600],
    ]),
    "на-проверке": открыть(ПРОВЕРКА).concat([
      ["②а низ по канону", null, низ],
      ["②б отзыв и удаление в меню", открытьМеню, меню],
      ["②в удалено", function(){
          var п=все(страница(),'[role="menuitem"]').find(function(э){ return текст(э)==="Удалить отчёт"; });
          if(п) п.click();
          setTimeout(подтвердить, 900);
        }, естьВСписке(ПРОВЕРКА), 3200],
    ]),
    "одобрен-выгружен": открыть(ОДОБРЕН).concat([
      ["③а удаления в меню нет", открытьМеню, меню, 2200],
    ]),
    "отклонён": открыть(ОТКЛОНЁН).concat([
      ["④а низ без удаления", null, низ],
      ["④б удалено из меню", удалитьИзМеню, function(){
          return шторка() ? "шторка открыта" : "шторки нет"; }, 1600],
      ["④в удалено", подтвердить, естьВСписке(ОТКЛОНЁН), 2600],
    ]),
    "свайп": [
      ["⓪ экран отчётов", открытьОтчёты, function(){ return кнопкаВ(страница(),"Отчёты") ? "Отчёты" : "НЕТ"; }],
      ["⑤а действие строки", function(){
          // ⚠️ НЕ ЖЕСТОМ, И ЭТО НАЗВАНО В ШАПКЕ: жмём кнопку действия строки.
          var к=все(страница(),'button[aria-label="Удалить"]');
          if(к.length) к[к.length-1].click();
        }, function(){ return шторка() ? "шторка открыта" : "шторки нет"; }, 1600],
      ["⑤б удалено", подтвердить, естьВСписке(СВАЙП), 2600],
    ],
  };
  var сценарий=ФАЗЫ[фаза]||[];
  function идти(i){
    if(i>=сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    if(сценарий[i][1]) сценарий[i][1]();
    setTimeout(function(){
      var что="—";
      try { что=сценарий[i][2](); } catch(е){ что="ОШИБКА ЗАМЕРА"; }
      var слепок=все(страница(),'button').map(текст).filter(Boolean)
        .map(function(т){ return т.slice(0,18); }).slice(0,8).join(" | ");
      шаги.push(сценарий[i][0]+": "+что+" ~ "+слепок);
      идти(i+1);
    }, сценарий[i][3]||1200);
  }
  function согласие(дальше){
    var отм=все(страница(),'button[aria-label="Отметить"]');
    if(!отм.length) return дальше();
    отм.forEach(function(б){ б.click(); });
    setTimeout(function(){
      var д=кнопкаВ(страница(),"Продолжить"); if(д) д.click();
      setTimeout(дальше, 1500);
    }, 500);
  }
  function старт(){
    if(document.getElementById("ЗАМЕР").textContent) return;
    if(!сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(
        {"НЕ_ОТРИСОВАЛОСЬ":true,"причина":"неизвестная фаза «"+фаза+"»"});
      return;
    }
    var готово=кнопкаВ(страница(),"Чеки") || кнопкаВ(страница(),"Продолжить");
    if(!готово && ждём++<80) return setTimeout(старт,150);
    if(!готово){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(
        {"НЕ_ОТРИСОВАЛОСЬ":true,"причина":"приложение не поднялось за 12 с; кнопки: "+
          все(страница(),'button').map(текст).slice(0,12).join(" | ")});
      return;
    }
    согласие(function(){ идти(0); });
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
