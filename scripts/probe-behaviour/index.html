<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>проба поведения</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ СЦЕНАРИЙ, А НЕ СНИМОК: жмём кнопки как человек и записываем, где оказались.
// Семь шагов, и два последних существуют ради конкретных поломок:
//   ⑥ ловит «явный выход не сбросил экран» — вернёт в профиль;
//   ⑦ ловит «подэкран не сброшен» — профиль откроется сразу в «Аккаунте».
// Без ⑦ вторая поломка НЕНАБЛЮДАЕМА: при page="glavnaya" подэкран не виден.
(function(){
  var шаги=[], ждём=0;
  function имяЭкрана(){
    var м=document.querySelector('button[aria-label="Переключить приложение"]');
    var s=м && м.parentElement ? м.parentElement.querySelector('span') : null;
    var т=s ? s.textContent.trim() : "";
    if(т) return т;
    return document.querySelector('input[type="password"]') ? "ЭКРАН ВХОДА" : "—";
  }
  function кнопкаПо(текст){
    // ⚠️ ТОЧНОЕ совпадение: «начинается с» кликало «Войти через Яндекс ID»
    return [].slice.call(document.querySelectorAll('button')).find(function(б){
      return (б.textContent||"").trim()===текст;
    });
  }
  function вписать(поле, значение){
    // ⚠️ React не видит value, выставленное напрямую — у него свой сеттер
    var сеттер=Object.getOwnPropertyDescriptor(
      window.HTMLInputElement.prototype, "value").set;
    сеттер.call(поле, значение);
    поле.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function пунктХаба(имя){
    // ⚠️ по признаку экрана, а не по тексту: в кнопке ещё подпись,
    // и точное совпадение по тексту её не находит
    return document.querySelector('button[data-ekran="'+имя+'"]');
  }
  var сценарий=[
    ["① загрузка", null],
    ["② открыт профиль", function(){ var к=document.querySelector('button[aria-label="Аккаунт"]'); if(к) к.click(); }],
    ["③ открыт подэкран", function(){ var к=пунктХаба("Аккаунт"); if(к) к.click(); }],
    ["④ возврат в хаб", function(){ var к=кнопкаПо("Профиль"); if(к) к.click(); }],
    ["⑤ после выхода", function(){ var к=кнопкаПо("Выйти"); if(к) к.click(); }],
    ["⑥ после входа", function(){
        var п=document.querySelectorAll('input');
        if(п[0]) вписать(п[0], "i@example.com");
        if(п[1]) вписать(п[1], "пароль");
        var в=кнопкаПо("Войти"); if(в) в.click(); }],
    ["⑦ профиль снова", function(){ var к=document.querySelector('button[aria-label="Аккаунт"]'); if(к) к.click(); }],
  ];
  // ⚠️ ЗАПИСЫВАЕМ ПОСЛЕ ДЕЙСТВИЯ, а не до. Первая редакция писала имя
  // экрана ПЕРЕД кликом, и весь замер оказался сдвинут на шаг —
  // «② профиль: Главная» читалось как поломка, а это была ошибка пробы.
  function идти(i){
    if(i>=сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    if(сценарий[i][1]) сценарий[i][1]();
    setTimeout(function(){
      /* ⚠️ пишем и ТЕКСТ ОШИБКИ: без него «остались на экране входа»
         не отличить от «остались с враньём про подтверждение почты» */
      /* ⚠️ экран входа рисует ошибку обычным div на красном фоне,
         без role="alert" — ищем и по нему тоже, иначе текст
         теряется и «остались на входе» не отличить от «остались
         с враньём про подтверждение почты» */
      var о=document.querySelector('[role="alert"]')
        || [].slice.call(document.querySelectorAll("div")).find(function(d){
             return d.children.length===0 &&
               getComputedStyle(d).backgroundColor==="rgb(254, 242, 242)";
           });
      var т=о?о.textContent.trim():"";
      шаги.push(сценарий[i][0]+": "+имяЭкрана()+(т?" | "+т:""));
      идти(i+1);
    }, 550);
  }
  function старт(){
    if(!document.querySelector('button[aria-label="Аккаунт"]') && ждём++<40)
      return setTimeout(старт,150);
    идти(0);
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
