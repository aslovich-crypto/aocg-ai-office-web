<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>проба отправки в 1С</title>
<style>body{margin:0;background:#F6F7F9;width:430px}</style></head>
<body><div id="root"></div>
<div id="ЗАМЕР"></div>
<script>
// ⚠️ ПРОБА «ОТПРАВКА В 1С» (1C-29 ②б). Фаза приходит в адресе (?f=…),
// журнал отправок к этому моменту уже засеян драйвером через базу. Проба
// открывает карточку отчёта так, как открывает человек, и читает футер,
// меню и плашку ТОЛЬКО внутри диалога отчёта — не со всей страницы: иначе
// строка из соседнего экрана сошла бы за строку карточки.
(function(){
  var ОТЧЁТ="Отчёт для 1С", ПРОДАВЕЦ="Лавка Проба1С";
  var фаза=new URLSearchParams(location.search).get("f")||"";
  var шаги=[], ждём=0;
  function все(корень, селектор){
    return корень ? [].slice.call(корень.querySelectorAll(селектор)) : [];
  }
  function текст(э){ return (э && э.textContent || "").trim(); }
  function кнопкаВ(корень, т){
    return все(корень,'button').find(function(б){ return текст(б)===т; });
  }
  function кнопкаСо(корень, т){
    return все(корень,'button').find(function(б){ return текст(б).indexOf(т)>=0; });
  }
  function страница(){ return document.body; }
  // Диалог отчёта — последний открытый: из карточки чека он ляжет поверх неё.
  function диалог(){
    var д=все(страница(),'[role="dialog"]').filter(function(э){
      return (э.getAttribute('aria-label')||"").indexOf('Отчёт «')===0;
    });
    return д[д.length-1]||null;
  }
  // 1С в карточке — бейджи, строка под ними и строка жёлтой плашки (1C-29 ③).
  // Читаются по меткам data-1c в порядке документа, только внутри диалога.
  function строка1С(){
    var с=все(диалог(),'[data-1c]').map(текст).filter(Boolean);
    return с.length ? с.join(" + ") : "1С нет";
  }
  function кнопка1С(){ return кнопкаВ(диалог(),"Отправить в 1С") ? "кнопка есть" : "кнопки нет"; }
  function футер(){ return строка1С()+" · "+кнопка1С(); }
  function пунктыМеню(){ return все(страница(),'[role="menuitem"]').map(текст); }
  function открытьОтчёты(){ var к=кнопкаВ(страница(),"Отчёты"); if(к) к.click(); }
  function открытьОтчёт(){
    var строка=все(страница(),'[role="button"]').filter(function(э){
      return текст(э).indexOf(ОТЧЁТ)>=0;
    }).pop();
    if(строка) строка.click();
  }
  function закрытьОтчёт(){ var к=все(диалог(),'button[aria-label="Назад"]')[0]; if(к) к.click(); }
  // REP-SWIPE1C: действие строки списка и шторка отправки.
  // ⚠️ ДЕЙСТВИЕ ИЩЕТСЯ В СВОЕЙ СТРОКЕ, А НЕ ГДЕ УГОДНО НА СТРАНИЦЕ, И ГРАНИЦА
  // СТРОКИ ОПРЕДЕЛЯЕТСЯ СЧЁТОМ, А НЕ ЧИСЛОМ ШАГОВ ВВЕРХ. Первая редакция
  // брала все кнопки с таким ярлыком и находила их у СОСЕДНЕГО одобренного
  // отчёта («Самопроверка 1С», его заводит сам драйвер). Вторая поднималась
  // на восемь уровней и доходила до КОНТЕЙНЕРА СПИСКА — а его текст содержит
  // название нашего отчёта всегда, так что подходила любая кнопка. Обе
  // редакции были зелёными там, где смотреть не на что: ровно случай «прибор
  // целится в соседний узел» (RULES-FRONTEND, М4 в UX-26).
  // Признак своей строки: предок, внутри которого РОВНО ОДНА строка списка
  // (role="button") и её текст содержит наше название.
  function действиеСтроки(имя, заголовок){
    return все(страница(),'button[aria-label="'+имя+'"]').filter(function(б){
      var у=б.parentElement;
      while(у && у!==document.body){
        var строк=все(у,'[role="button"]');
        if(строк.length>1) return false;           // поднялись до списка
        if(строк.length===1 && текст(строк[0]).indexOf(заголовок)>=0) return true;
        у=у.parentElement;
      }
      return false;
    });
  }
  function шторкаОтправки(){
    return все(страница(),'[role="alertdialog"]').find(function(э){
      return (э.getAttribute("aria-label")||"").indexOf("Отправить")===0;
    })||null;
  }
  function открытьМеню(){ var к=все(диалог(),'button[aria-label="Ещё"]')[0]; if(к) к.click(); }
  function запросов(){ return "запросов состояния "+window.__v1s.состояние; }
  function карточкаОткрыта(){
    // Открыта И загрузилась: бейдж статуса — признак ответа GET /reports/{id},
    // без него «футера нет» значило бы «карточка пустая», а не «футера нет».
    var д=диалог();
    return д && текст(д).indexOf("Одобрен")>=0 ? "открыта" : (д ? "открыта, не загрузилась" : "не открыта");
  }
  var ОТКРЫТЬ=[
    ["⓪ экран отчётов", открытьОтчёты, function(){ return кнопкаВ(страница(),"Отчёты") ? "Отчёты" : "НЕТ"; }],
    ["⓪б карточка открыта", открытьОтчёт, function(){ return диалог() ? "открыта" : "не открыта"; }, 1600],
  ];
  var ФАЗЫ={
    "одобрить": ОТКРЫТЬ.concat([
      ["①а футер «на проверке»", null, function(){
          return кнопкаВ(диалог(),"✓ Одобрить") ? "Одобрить есть" : "Одобрить нет"; }],
      ["①б 1С после одобрения", function(){
          var к=кнопкаВ(диалог(),"✓ Одобрить"); if(к) к.click(); }, футер, 2500],
      ["②а отказ отправки дословно", function(){
          var к=кнопкаВ(диалог(),"Отправить в 1С"); if(к) к.click(); },
        function(){ return все(диалог(),'[role="alert"]').map(текст).join(" | ")||"плашки нет"; }, 3000],
      ["②б состояние перечитано", null, function(){ return строка1С()+" · "+запросов(); }],
    ]),
    "непроведён": ОТКРЫТЬ.concat([
      ["③а строка «не проведён»", null, футер],
      ["③б отмена в меню", открытьМеню, function(){
          return пунктыМеню().indexOf("Отменить отправку в 1С")>=0 ? "Отменить отправку в 1С есть" : "Отменить отправку в 1С нет"; }],
      ["③в закрыть и открыть", function(){
          window.__было=строка1С();
          открытьМеню();  // второй тап по «Ещё» закрывает меню
          setTimeout(function(){ закрытьОтчёт(); setTimeout(открытьОтчёт, 600); }, 300);
        }, function(){
          return запросов()+" · строка "+(строка1С()===window.__было ? "та же" : "другая: "+строка1С()); }, 3200],
    ]),
    "идёт": ОТКРЫТЬ.concat([
      ["④а строка «идёт»", null, футер],
      ["④б отмены в меню нет", открытьМеню, function(){
          // «⋯» рисуется, только когда в меню есть что показать (1C-29 ③).
          if(!все(диалог(),'button[aria-label="Ещё"]').length) return "⋯ нет";
          return пунктыМеню().indexOf("Отменить отправку в 1С")>=0 ? "Отменить отправку в 1С есть" : "Отменить отправку в 1С нет"; }],
    ]),
    "прервана": ОТКРЫТЬ.concat([
      ["⑤а строка «прервалась»", null, футер],
      ["⑤б отмена через шторку", function(){
          открытьМеню();
          setTimeout(function(){
            var п=все(страница(),'[role="menuitem"]').find(function(э){ return текст(э)==="Отменить отправку в 1С"; });
            if(п) п.click();
          }, 500);
        }, function(){ return все(страница(),'[role="alertdialog"]').length ? "шторка открыта" : "шторки нет"; }, 1400],
      ["⑤в строка после отмены", function(){
          var ш=все(страница(),'[role="alertdialog"]')[0];
          var к=кнопкаВ(ш,"Отменить отправку"); if(к) к.click();
        }, function(){ return футер()+" · "+запросов(); }, 3000],
    ]),
    "перезагрузка": ОТКРЫТЬ.concat([["⑥ после перезагрузки", null, футер]]),
    "ошибка": ОТКРЫТЬ.concat([["⑦ последняя неудача", null, футер]]),
    "справка-чек": [
      ["⓪ экран чеков", function(){ var к=кнопкаВ(страница(),"Чеки"); if(к) к.click(); },
        function(){ return кнопкаВ(страница(),"Чеки") ? "Чеки" : "НЕТ"; }],
      ["⓪б карточка чека", function(){
          var э=все(страница(),'div').filter(function(д){
            return текст(д).indexOf(ПРОДАВЕЦ)>=0 && (д.getAttribute('style')||"").indexOf('cursor: pointer')>=0;
          }).pop();
          if(э) э.click();
        }, function(){ return все(страница(),'[role="dialog"][aria-label="Детали чека"]').length ? "открыта" : "не открыта"; }, 1600],
      ["⑧а из карточки чека", function(){
          var к=кнопкаСо(все(страница(),'[role="dialog"][aria-label="Детали чека"]')[0],"В отчёте");
          if(к) к.click();
        }, function(){
          var о=карточкаОткрыта(); if(о!=="открыта") return о;
          return строка1С()==="1С нет" && кнопка1С()==="кнопки нет" ? "1С не показан" : "1С ПОКАЗАН: "+футер(); }, 2500],
    ],
    "справка-уведомление": [
      ["⓪ уведомления", function(){ var к=все(страница(),'button[aria-label="Уведомления"]')[0]; if(к) к.click(); },
        function(){ return все(страница(),'[role="dialog"][aria-label="Уведомления"]').length ? "открыты" : "не открыты"; }, 1600],
      ["⑧б из уведомлений", function(){
          var к=кнопкаСо(все(страница(),'[role="dialog"][aria-label="Уведомления"]')[0],"Отчёт одобрен");
          if(к) к.click();
        }, function(){
          var о=карточкаОткрыта(); if(о!=="открыта") return о;
          return строка1С()==="1С нет" && кнопка1С()==="кнопки нет" ? "1С не показан" : "1С ПОКАЗАН: "+футер(); }, 2500],
      // Замер без оценки: какой заголовок видит человек в карточке,
      // открытой из уведомления (заглушка title «Отчёт» против настоящего).
      ["ℹ заголовок из уведомления", null, function(){
          return (диалог()||{getAttribute:function(){return "нет диалога";}}).getAttribute('aria-label'); }],
    ],
    "свайп-1С": [
      ["⓪ экран отчётов", открытьОтчёты, function(){ return кнопкаВ(страница(),"Отчёты") ? "Отчёты" : "НЕТ"; }],
      ["⑩а действие «В 1С» есть", null, function(){
          return действиеСтроки("В 1С", ОТЧЁТ).length ? "В 1С есть" : "В 1С нет"; }],
      ["⑩б шторка с названием", function(){
          var к=действиеСтроки("В 1С", ОТЧЁТ); if(к.length) к[к.length-1].click();
        }, function(){
          var ш=шторкаОтправки();
          return ш ? ш.getAttribute("aria-label") : "шторки нет"; }, 1600],
      // ⚠️ ЗАМЕР РАНЬШЕ, ЧЕМ ТОСТ ПОГАСНЕТ. Он живёт 3 секунды; первая
      // редакция читала на 3,2 и честно отвечала «тоста нет» при верном
      // коде. Срок жизни сообщения — часть предмета замера, а не фон.
      ["⑩в отказ дословно", function(){
          var ш=шторкаОтправки(); if(!ш) return;
          var к=кнопкаВ(ш,"Отправить в 1С"); if(к) к.click();
        }, function(){
          return все(страница(),'[role="status"],[role="alert"]').map(текст)
            .filter(Boolean).join(" | ")||"тоста нет"; }, 1800],
    ],
    "свайп-1С-уехал": [
      ["⓪ экран отчётов", открытьОтчёты, function(){ return кнопкаВ(страница(),"Отчёты") ? "Отчёты" : "НЕТ"; }],
      ["⑪ у отправленного действия нет", null, function(){
          return действиеСтроки("В 1С", ОТЧЁТ).length ? "В 1С ЕСТЬ" : "В 1С нет"; }],
      ["ℹ что ответила ручка списка", null, function(){
          return window.__in1c===undefined ? "не спрошено" : String(window.__in1c); }, 1500],
    ],
    "роль": [
      ["⓪ профиль", function(){ var к=все(страница(),'button[aria-label="Аккаунт"]')[0]; if(к) к.click(); },
        function(){ return все(страница(),'button[data-ekran="Пользователи"]').length ? "хаб" : "НЕТ"; }],
      ["⓪б пользователи", function(){ var к=все(страница(),'button[data-ekran="Пользователи"]')[0]; if(к) к.click(); },
        function(){ return кнопкаСо(страница(),"Пригласить сотрудника") ? "экран" : "НЕТ"; }, 1600],
      ["⓪в приглашение", function(){ var к=кнопкаСо(страница(),"Пригласить сотрудника"); if(к) к.click(); },
        function(){ return все(страница(),'[role="dialog"][aria-label="Пригласить сотрудника"]').length ? "лист" : "НЕТ"; }],
      ["⑨ подпись «Бухгалтер»", function(){
          var л=все(страница(),'[role="dialog"][aria-label="Пригласить сотрудника"]')[0];
          var к=кнопкаВ(л,"Бухгалтер"); if(к) к.click();
        }, function(){
          var л=все(страница(),'[role="dialog"][aria-label="Пригласить сотрудника"]')[0];
          return текст(л).indexOf("отправляет одобренные в 1С")>=0 ? "отправляет одобренные в 1С" : "о 1С ни слова"; }],
    ],
  };
  var сценарий=ФАЗЫ[фаза]||[];
  function идти(i){
    if(i>=сценарий.length){
      var в=window.__v1s||{};
      шаги.push("ℹ запросов "+в.запросов+" · отказов 429: "+в.отказов429+" · 403: "+в.отказов403+" ~ ");
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(шаги);
      return;
    }
    if(сценарий[i][1]) сценарий[i][1]();
    setTimeout(function(){
      var что="—";
      try { что=сценарий[i][2](); } catch(е){ что="ОШИБКА ЗАМЕРА"; }
      // Слепок к каждому шагу — подписи кнопок, как у skvoz (T89).
      var слепок=все(страница(),'button').map(текст).filter(Boolean)
        .map(function(т){ return т.slice(0,18); }).slice(0,8).join(" | ");
      шаги.push(сценарий[i][0]+": "+что+" ~ "+слепок);
      идти(i+1);
    }, сценарий[i][3]||1200);
  }
  // ⚠️ СОГЛАСИЕ СПРАШИВАЕТ СЕРВЕР (T135): пользователя завёл драйвер
  // запросом, согласия у него нет, и первый снимок начнётся с этого экрана.
  // Проходим его здесь, вне замера: это не предмет пробы, а дверь к нему.
  function согласие(дальше){
    var отм=все(страница(),'button[aria-label="Отметить"]');
    if(!отм.length) return дальше();
    отм.forEach(function(б){ б.click(); });
    setTimeout(function(){
      var д=кнопкаВ(страница(),"Продолжить"); if(д) д.click();
      setTimeout(дальше, 1500);
    }, 500);
  }
  function старт(){
    if(document.getElementById("ЗАМЕР").textContent) return;
    if(!сценарий.length){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(
        {"НЕ_ОТРИСОВАЛОСЬ":true,"причина":"неизвестная фаза «"+фаза+"»"});
      return;
    }
    var готово=кнопкаВ(страница(),"Чеки") || кнопкаВ(страница(),"Продолжить");
    if(!готово && ждём++<80) return setTimeout(старт,150);
    if(!готово){
      document.getElementById("ЗАМЕР").textContent=JSON.stringify(
        {"НЕ_ОТРИСОВАЛОСЬ":true,"причина":"приложение не поднялось за 12 с; кнопки: "+
          все(страница(),'button').map(текст).slice(0,12).join(" | ")});
      return;
    }
    согласие(function(){ идти(0); });
  }
  старт();
})();
</script>
<script type="module" src="./probe.jsx"></script></body></html>
