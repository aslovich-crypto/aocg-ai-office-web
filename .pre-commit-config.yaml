# AOCG AI Офис — фронтенд · pre-commit хуки
# Установка один раз: pip install pre-commit && pre-commit install
# Обновить версии: pre-commit autoupdate

repos:
  # --- Блокировка секретов ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Базовая гигиена ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # --- Prettier (форматирование JS/JSX/CSS) ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json]

  # --- ESLint (T8) + сторож токенов темы (T9) ---
  # `npm run lint` = eslint + scripts/check-theme-tokens.mjs. Второй ловит то,
  # чего eslint не видит: обращение к несуществующему ключу карты токенов
  # (C.bg, T.warningFg) — оно даёт undefined, и стиль молча не применяется.
  # Тем же вызовом это работает и в CI, дублировать шаг не нужно.
  #
  # Конфиг (eslint.config.js) существовал давно и включает no-undef, но
  # линтер нигде не запускался: в хуках был только prettier, CI на фронте
  # не было. Из-за этого до прода дошёл ReferenceError — setReceipts
  # вызывался из компонента, где не объявлен. Хук локальный (system):
  # eslint ставится через npm вместе с проектом, отдельная среда не нужна.
  # pass_filenames: false — конфиг flat сам определяет, что проверять,
  # а точечная проверка изменённых файлов пропустила бы поломку связей.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (no-undef и правила React) + токены темы
        entry: npm run lint
        language: system
        types_or: [javascript, jsx]
        pass_filenames: false
