# AOCG AI Офис — фронтенд · pre-commit хуки
# Установка один раз: pip install pre-commit && pre-commit install
# Обновить версии: pre-commit autoupdate

repos:
  # --- Блокировка секретов ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Базовая гигиена ---
  # design/ исключён из «причёсывающих» хуков: там вендорная копия ДС, она
  # сверяется ПОБАЙТНО. В её шапке-отметке есть концевой пробел, и
  # trailing-whitespace молча срезал бы его — копия перестала бы совпадать
  # с выгрузкой, а мы бы «починили» это пересчётом суммы и закрепили расхождение.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^design/
      - id: end-of-file-fixer
        exclude: ^design/
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # --- Prettier (форматирование JS/JSX/CSS) ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json]

  # --- ESLint (T8) + сторожа темы (T9, T10) ---
  # `npm run lint` = eslint + check-design-vendor + check-theme-tokens.
  # Три РАЗНЫХ класса ошибок, поэтому три проверки:
  #   eslint              — необъявленные имена, правила React;
  #   check-design-vendor — design/theme.mjs дословно совпадает с выгрузкой
  #                         дизайн-системы (её не правят руками);
  #   check-theme-tokens  — код обращается к ключу темы, который существует
  #                         (C.bg → undefined, стиль молча не применяется).
  # Тем же вызовом это работает и в CI, дублировать шаги не нужно.
  #
  # Конфиг (eslint.config.js) существовал давно и включает no-undef, но
  # линтер нигде не запускался: в хуках был только prettier, CI на фронте
  # не было. Из-за этого до прода дошёл ReferenceError — setReceipts
  # вызывался из компонента, где не объявлен. Хук локальный (system):
  # eslint ставится через npm вместе с проектом, отдельная среда не нужна.
  # pass_filenames: false — конфиг flat сам определяет, что проверять,
  # а точечная проверка изменённых файлов пропустила бы поломку связей.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (no-undef и правила React) + токены темы
        entry: npm run lint
        language: system
        types_or: [javascript, jsx]
        pass_filenames: false

      # ⚠️ ПРИБОР ИКОНКИ ЖИВЁТ ЗДЕСЬ, А НЕ В ОБЩЕМ `npm run lint`, И ЭТО
      # РЕШЕНИЕ, А НЕ УДОБСТВО. Он требует python3 и PIL. Замер 29.08.2026:
      # `npm run lint` вызывается в CI (.github/workflows/lint.yml:33,
      # runs-on: ubuntu-latest), и НИ ОДИН шаг того workflow не ставит ни
      # python, ни PIL — только checkout, setup-node и `npm ci`. Значит
      # общий lint с этой зависимостью падал бы на каждом push в main.
      # Про Timeweb на момент выноса было НЕИЗВЕСТНО — конфига деплоя
      # в репозитории нет ни одного файла, площадка настраивается своей
      # панелью. ⚠️ ЗАКРЫТО ЗАМЕРОМ ВЛАДЕЛЬЦА 29.08.2026: команда сборки
      # там `npm run build`, зависимости пусто, директория /dist, версия
      # окружения 24 — то есть lint в путь выкладки НЕ входит, и риск был
      # только в CI. Вынос всё равно верен: он снял единственный реальный
      # отказ (пункт ②) и снял зависимость от того, что панель не изменят.
      # ⚠️ Тот же замер дал побочную находку — прод на Node 24, CI на 22,
      # в репозитории версия не объявлена вовсе. Заведена строкой T88.
      #
      # ⚠️ РАЗДЕЛЕНИЕ ПО СУЩЕСТВУ, А НЕ ПО СРЕДЕ. `check-app-icon.mjs`
      # остаётся в общем lint: он на чистом Node и проверяет, что стоит
      # КАНОННЫЙ файл (sha256) — это нужно везде, включая CI. Здешний
      # прибор проверяет, что СБОРКА из спецификации не разошлась с
      # каноном, — это нужно тому, кто трогает канон, то есть локально.
      - id: app-icon-rebuild
        name: "иконка — сборка из спецификации против канона (MOB-4)"
        entry: npm run lint:icon
        language: system
        files: '^(design/app-icon\.source\.json|design/aocg-mark\.svg|design/theme\.mjs|public/apple-touch-icon\.png|scripts/build-app-icon\.py)$'
        pass_filenames: false
